
name: Build VoidXen Mobile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          TYPE=$(grep '^buildType=' launcher.properties | cut -d= -f2 | tr -d '\r ')
          if [ "$TYPE" = "release" ]; then
            gradle --no-daemon assembleRelease
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(grep '^apkName=' launcher.properties | cut -d= -f2 | tr -d '\r ')
          mkdir -p out
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "out/${NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidXen-Mobile-APK
          path: out/*.apk
          if-no-files-found: error
          
