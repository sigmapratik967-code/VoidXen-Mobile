
name: Build VoidXen Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -e
          SDK="$ANDROID_HOME"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract project ZIP if needed
        shell: bash
        run: |
          set -e
          if ! find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' -not -path '*/.gradle/*' | grep -q .; then
            ZIP=$(find . -type f -name "VoidXenMobile.zip" -not -path '*/.git/*' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "ERROR: Gradle project and VoidXenMobile.zip not found"
              exit 1
            fi
            mkdir -p extracted
            unzip -oq "$ZIP" -d extracted
          fi

      - name: Find Gradle project
        shell: bash
        run: |
          set -e
          FILE=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Found project: $DIR"
          ls -la "$DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidXenMobile-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
